[build]
  command = "echo done"
  publish = "."

# Headers globales de seguridad
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    X-Permitted-Cross-Domain-Policies = "none"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://*.googletagmanager.com https://www.clarity.ms https://scripts.clarity.ms; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://*.netlify.com https://www.google-analytics.com https://analytics.google.com https://*.google.com https://*.google.cl https://stats.g.doubleclick.net https://*.clarity.ms; frame-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://wa.me https://api.whatsapp.com; object-src 'none'"

# Caché larga para assets versionados con ?v= (se invalida al cambiar la query)
[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# El catálogo de notebooks se retiró: redirigir las URLs antiguas al home
[[redirects]]
  from = "/usados.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/usados"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/ficha.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/ficha"
  to = "/"
  status = 301
  force = true

# Bloquear archivos sensibles del código fuente
[[redirects]]
  from = "/server.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/vite.config.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/postcss.config.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tailwind.config.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/SECURITY.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

# El sitio publicado no usa /src/* (solo quedan fuentes sin referencias)
[[redirects]]
  from = "/src/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.git/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.env"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.github/*"
  to = "/404.html"
  status = 404
  force = true

