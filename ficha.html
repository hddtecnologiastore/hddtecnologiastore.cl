<style>
.ficha-wrap{max-width:1100px;margin:0 auto;padding:90px 1.2rem 3rem}
.ficha-back{display:inline-flex;align-items:center;gap:.35rem;color:var(--mut);font-size:.8rem;text-decoration:none;margin-bottom:1rem;transition:color .2s}
.ficha-back:hover{color:var(--acc)}

.ficha-top{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;align-items:stretch;margin-bottom:1.2rem}
.galeria-col{display:flex;flex-direction:column;min-height:0}
.galeria-main{width:100%;flex:1;min-height:420px;border-radius:14px;overflow:hidden;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.galeria-main img{width:100%;height:100%;object-fit:contain}
.galeria-thumbs{display:flex;gap:.4rem;margin-top:.5rem;flex-shrink:0}
.galeria-thumbs img{width:56px;height:42px;object-fit:cover;border-radius:6px;cursor:pointer;opacity:.45;border:2px solid transparent;transition:all .15s}
.galeria-thumbs img.active,.galeria-thumbs img:hover{opacity:1;border-color:var(--acc)}

.fi{display:flex;flex-direction:column;gap:.4rem}
.fi-etiqueta{display:inline-block;align-self:flex-start;background:rgba(56,189,248,.15);color:#38bdf8;font-size:.65rem;font-weight:700;padding:.25rem .7rem;border-radius:999px;letter-spacing:1.5px}
.fi-titulo{font-size:clamp(1.4rem,5.5vw,1.8rem);font-weight:800;color:#fff;line-height:1.15;margin:0;overflow-wrap:anywhere}
.fi-estado{font-size:.8rem;color:var(--mut)}
.fi-estado b{color:#e2e8f0}
.fi-precios{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap;margin:.3rem 0}
.precio-ref-f{font-size:1rem;color:#f87171;text-decoration:line-through;font-weight:500}
.precio-final{font-size:clamp(1.6rem,6vw,2rem);color:#38bdf8;font-weight:800}
.fi-garantia{display:inline-flex;align-self:flex-start;align-items:center;gap:.45rem;background:rgba(37,211,102,.13);border:1px solid rgba(37,211,102,.45);color:#4ade80;font-size:.8rem;font-weight:800;padding:.5rem .9rem;border-radius:999px;letter-spacing:.4px;box-shadow:0 2px 12px rgba(37,211,102,.18)}
.fi-garantia::before{content:'🛡️'}
.ahorro-b{background:rgba(56,189,248,.15);color:#38bdf8;font-size:.75rem;padding:.2rem .6rem;border-radius:999px;font-weight:700}
.btn-wa-f{display:flex;align-items:center;justify-content:center;gap:.5rem;background:#25d366;color:#fff;min-height:48px;padding:.85rem 1.2rem;border-radius:12px;font-weight:700;font-size:.95rem;text-decoration:none;transition:background .2s}
.btn-wa-f:hover{background:#1ebe5d}
.btn-back-f{display:flex;align-items:center;justify-content:center;gap:.4rem;background:transparent;color:#fff;padding:.7rem 1.2rem;border-radius:12px;font-weight:600;font-size:.85rem;text-decoration:none;border:1px solid var(--line);transition:border-color .2s}
.btn-back-f:hover{border-color:var(--acc)}

.ficha-section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.2rem;margin-bottom:1.2rem}
.ficha-section h3{
  font-size:.85rem;font-weight:800;color:#38bdf8;letter-spacing:2px;text-transform:uppercase;margin:0 0 .8rem;
  padding-bottom:.5rem;border-bottom:1px solid rgba(56,189,248,.2);
  display:flex;align-items:center;gap:.4rem;
}
.ficha-section h3::before{content:'';display:inline-block;width:3px;height:14px;background:#38bdf8;border-radius:2px}

.specs-grid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.spec-item{display:flex;flex-direction:column;padding:.55rem .7rem;background:rgba(56,189,248,.06);border-radius:8px;text-align:center}
.spec-item small{font-size:.65rem;color:#38bdf8;text-transform:uppercase;letter-spacing:1.2px;font-weight:800}
.spec-item b{font-size:.88rem;color:#e2e8f0;font-weight:700;margin-top:.15rem;overflow-wrap:anywhere}

.fila-doble{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem;margin-bottom:1.2rem}
.fila-doble .ficha-section{margin-bottom:0}
.fila-triple{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1.2rem;margin-bottom:1.2rem}
.fila-triple .ficha-section{margin-bottom:0}

.ficha-desc{font-size:.88rem;color:#94a3b8;line-height:1.7;margin:0}
.puerto-chip{display:inline-block;background:rgba(56,189,248,.08);color:#94a3b8;font-size:.78rem;padding:.3rem .6rem;border-radius:6px;margin:.15rem .15rem 0 0}
.sw-item{margin-bottom:.6rem}
.sw-item:last-child{margin-bottom:0}
.sw-item b{color:#e2e8f0;font-size:.85rem}
.sw-item small{color:var(--mut);font-size:.72rem;margin-left:.3rem}
.sw-item p{font-size:.8rem;color:#94a3b8;margin:.15rem 0 0;line-height:1.5}
.conf-grid{display:grid;grid-template-columns:1fr 1fr;gap:.35rem}
.conf-item{display:flex;align-items:center;gap:.45rem;font-size:.8rem;color:#94a3b8}
.conf-item::before{content:'✓';color:#4ade80;font-weight:700;font-size:.85rem}

.prog-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.7rem}
.prog-item{display:flex;flex-direction:column;align-items:center;gap:.5rem;padding:.8rem .35rem;background:rgba(56,189,248,.06);border:1px solid rgba(56,189,248,.1);border-radius:10px;transition:border-color .2s}
.prog-item:hover{border-color:rgba(56,189,248,.35)}
.prog-icon{width:46px;height:46px;display:flex;align-items:center;justify-content:center;border-radius:12px}
.prog-icon svg{width:28px;height:28px;display:block}
.prog-item small{font-size:.72rem;color:#e2e8f0;font-weight:600;text-align:center;line-height:1.25}
@media(max-width:767px){
  .prog-grid{grid-template-columns:repeat(2,1fr)}
  .ficha-top{grid-template-columns:1fr}
  .fila-doble{grid-template-columns:1fr}
  .fila-triple{grid-template-columns:1fr}
  .specs-grid{grid-template-columns:1fr 1fr}
  .ficha-wrap{padding:76px 1rem 2.5rem}
  .conf-grid{grid-template-columns:1fr}
  /* Orden móvil de la ficha: imagen+badge → título+precio → garantía → specs → CTA */
  .fi .ficha-section{order:1}
  .fi .btn-wa-f{order:2;min-height:52px;font-size:1rem}
  .fi .btn-back-f{order:3}
  .galeria-main{min-height:280px}
  .galeria-thumbs img{width:64px;height:48px}
}
</style>

<script>
(async function(){
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  const slug = params.get('slug');
  if (!id && !slug) { location.href = '/usados.html'; return; }

  const res = await fetch('/src/data/usados.json');
  const items = await res.json();
  const u = items.find(n => n.id === id || n.slug === slug);
  if (!u) { location.href = '/usados.html'; return; }

  // XSS prevention: escape HTML special chars (forma encadenada: sin objetos con comillas anidadas)
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  document.title = esc(u.titulo) + ' | HDD Tecnología Store';
  const e = u.especificaciones || {};
  const ahorro = u.precio_mercado ? Math.round((1 - u.precio_nosotros/u.precio_mercado)*100) : 0;
  const fotos = (u.fotos || []).flatMap(f => Array.isArray(f.url) ? f.url : (f.url ? [f.url] : []));
  const mainImg = fotos[0] || '/img/placeholder-notebook.jpg';
  const waMsg = encodeURIComponent(u.whatsapp_msg || `Hola, me interesa el ${u.titulo} publicado en la tienda.`);

  document.getElementById('waFloat').href = 'https://wa.me/56961991725?text=' + waMsg;

  const specs = [
    ['Procesador', e.procesador],
    ['RAM', e.ram],
    ['Almacenamiento', e.almacenamiento],
    ['Pantalla', e.pantalla],
    ['GPU', e.gpu],
    ['Batería · Ciclos', e.bateria_ciclos],
    ['Salud batería', e.bateria_salud],
    ['SO actual', e.so_actual],
    ['Peso', e.peso],
    ['Año', u.año],
  ].filter(([,v]) => v);

  const puertos = e.puertos || [];
  const soft = u.software_recomendado || [];

  const PROG_DEFS = {
    'office': { bg: 'rgba(235,108,31,.12)', svg: '<svg viewBox="0 0 24 24" fill="#eb6c1f"><path d="M14.5 3.5h-5C5.7 3.5 3 6.2 3 10v4c0 3.8 2.7 6.5 6.5 6.5h5c3.8 0 6.5-2.7 6.5-6.5v-4c0-3.8-2.7-6.5-6.5-6.5zm4.5 10.5c0 2.5-2 4.5-4.5 4.5h-5C7 18.5 5 16.5 5 14v-4c0-2.5 2-4.5 4.5-4.5h5c2.5 0 4.5 2 4.5 4.5v4z"/></svg>' },
    'malwarebytes': { bg: 'rgba(0,131,252,.12)', svg: '<svg viewBox="0 0 24 24" fill="#0083fc"><path d="M10.87 22.9027c.1571 0 .2796-.1236.2796-.2824 0-.124-.0874-.2828-.2445-.2828h-.088l-.1926-.0352c-3.2382-.636-5.6358-3.5505-5.6358-6.96 0-1.4478.4376-2.8256 1.19-3.938.1229-.1593.315-.2828.5254-.0884l5.1113 5.2277c.0342.0352.122.0883.1921.0883.0875 0 .1576-.0353.1927-.0883l5.1458-5.1924c.1927-.1944.368-.1588.473.0352a7.1 7.1 0 0 1 1.19 3.9385c0 1.819-.6826 3.4622-1.8032 4.7164-.0347.0353-.087.0883-.1222.1236 0 .0353-.035.0883-.035.1235 0 .1593.1225.2828.28.2828h.0351c.035 0 .0875-.0352.1225-.0352 6.8262-2.897 6.5116-9.75 6.5116-9.75 0-3.9036-1.8384-7.4184-4.6737-9.6263-.1224-.0883-.3151-.0883-.403.0352l-6.7033 6.8534c-.1228.1235-.3154.1235-.4376 0L5.0234 1.1949c-.1225-.1235-.2797-.1235-.4022-.0352C1.8379 3.3676 0 6.8293 0 10.786c0 6.2875 4.7086 11.4806 10.7825 12.1167Z"/></svg>' },
    'anydesk': { bg: 'rgba(229,38,33,.12)', svg: '<svg viewBox="0 0 24 24" fill="#e52621"><path d="M8.322 3.677L0 12l8.322 8.323L16.645 12zm7.371.01l-1.849 1.85 6.49 6.456-6.49 6.49 1.85 1.817L24 11.993Z"/></svg>' },
    'adobe': { bg: 'rgba(232,53,42,.12)', svg: '<svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="4" fill="#e8352a"/><text x="12" y="16.2" text-anchor="middle" fill="#fff" font-size="7.5" font-weight="800" font-family="Arial,Helvetica,sans-serif">PDF</text></svg>' },
  };
  const DEFAULT_PROGRAMAS = ['Office', 'Malwarebytes', 'AnyDesk', 'Adobe PDF'];
  const programas = ((Array.isArray(u.programas_incluidos) && u.programas_incluidos.length) ? u.programas_incluidos : DEFAULT_PROGRAMAS)
    .map(p => (p && p.nombre) || String(p || '').trim())
    .filter(Boolean);
  const progHtml = programas.map(nombre => {
    const n = nombre.toLowerCase();
    const key = n.includes('office') ? 'office'
      : n.includes('malware') ? 'malwarebytes'
      : n.includes('anydesk') ? 'anydesk'
      : (n.includes('adobe') || n.includes('pdf') || n.includes('acrobat')) ? 'adobe'
      : null;
    const def = PROG_DEFS[key] || { bg: 'rgba(56,189,248,.12)', svg: '<svg viewBox="0 0 24 24" fill="#38bdf8"><path d="M4 5h16v10H4zM2 19h20v2H2z"/></svg>' };
    return `<div class="prog-item"><span class="prog-icon" style="background:${def.bg}">${def.svg}</span><small>${nombre}</small></div>`;
  }).join('');

  document.getElementById('fichaContent').innerHTML = `
    <a href="/usados.html" class="ficha-back">← Volver al catálogo</a>

    <div class="ficha-top">
      <div class="galeria-col">
        <div class="galeria-main"><img id="mainImg" src="${mainImg}" alt="${esc(u.titulo)}"></div>
        ${fotos.length > 1 ? `<div class="galeria-thumbs">${fotos.map((f,i) => `<img src="${f}" alt="Foto ${i+1}" class="${i===0?'active':''}" onclick="document.getElementById('mainImg').src='${f}';document.querySelectorAll('.galeria-thumbs img').forEach(t=>t.classList.remove('active'));this.classList.add('active')">`).join('')}</div>` : ''}
      </div>
      <div class="fi">
        <span class="fi-etiqueta">${esc((u.etiqueta||'').toUpperCase())}</span>
        <h1 class="fi-titulo">${esc(u.titulo)}</h1>
        ${u.estado ? `<span class="fi-estado">Estado: <b>${esc(u.estado)}</b> · Stock disponible</span>` : ''}
        <div class="fi-precios">
          ${u.precio_mercado ? `<span class="precio-ref-f">$${u.precio_mercado.toLocaleString()}</span>` : ''}
          <span class="precio-final">$${u.precio_nosotros.toLocaleString()}</span>
          ${ahorro > 0 ? `<span class="ahorro-b">${ahorro}% OFF</span>` : ''}
        </div>
        <span class="fi-garantia">Garantía de 90 días</span>
        <a class="btn-wa-f" href="https://wa.me/56961991725?text=${waMsg}" target="_blank">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
          Consultar por WhatsApp
        </a>
        <a class="btn-back-f" href="/usados.html">← Ver todos los notebooks</a>

        ${specs.length ? `
        <div class="ficha-section" style="margin-top:.8rem;margin-bottom:0">
          <h3>Especificaciones técnicas</h3>
          <div class="specs-grid">
            ${specs.map(([k,v]) => `<div class="spec-item"><small>${esc(k)}</small><b>${esc(v)}</b></div>`).join('')}
          </div>
        </div>` : ''}
      </div>
    </div>

    <div class="fila-doble">
      <div class="ficha-section">
        <h3>Estado y condición</h3>
        <p class="ficha-desc">${esc(u.condicion_detalle || u.estado || '—')}</p>
      </div>
      ${puertos.length ? `
      <div class="ficha-section">
        <h3>Puertos y conectividad</h3>
        <div>${puertos.map(p => `<span class="puerto-chip">${esc(p)}</span>`).join('')}</div>
      </div>` : '<div></div>'}
    </div>

    <div class="fila-doble">
      <div class="ficha-section">
        <h3>Programas incluidos en el equipo:</h3>
        <div class="prog-grid">${progHtml}</div>
      </div>
      ${soft.length ? `
      <div class="ficha-section">
        <h3>Software recomendado</h3>
        ${soft.map(s => `<div class="sw-item"><b>${esc(s.nombre)}</b><small>(${esc(s.categoria)})</small><p>${esc(s.por_que)}</p></div>`).join('')}
      </div>` : '<div></div>'}
    </div>

    <div class="ficha-section" style="margin-bottom:2rem">
      <h3>¿Por qué comprar aquí?</h3>
      <div class="conf-grid">
        <div class="conf-item">Garantía real de 90 días en todo el equipo</div>
        <div class="conf-item">Diagnóstico completo antes de vender</div>
        <div class="conf-item">Atención directa con el técnico — sin intermediarios</div>
        <div class="conf-item">20 años de experiencia en notebooks</div>
        <div class="conf-item">Despacho a todo Chile</div>
        <div class="conf-item">Retiro en nuestro local Ñuñoa</div>
      </div>
    </div>
  `;
})();
</script>
