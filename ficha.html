<head>

<style>
.ficha-wrap{max-width:1100px;margin:0 auto;padding:90px 1.2rem 3rem}
.ficha-back{display:inline-flex;align-items:center;gap:.35rem;color:var(--mut);font-size:.8rem;text-decoration:none;margin-bottom:1rem;transition:color .2s}
.ficha-back:hover{color:var(--acc)}
.ficha-top{display:grid;grid-template-columns:420px 1fr;gap:2rem;align-items:start;margin-bottom:1.5rem}
.galeria-main{width:100%;border-radius:14px;overflow:hidden;background:var(--card);border:1px solid var(--line);aspect-ratio:4/3;display:flex;align-items:center;justify-content:center}
.galeria-main img{width:100%;height:100%;object-fit:contain}
.galeria-thumbs{display:flex;gap:.4rem;margin-top:.5rem}
.galeria-thumbs img{width:56px;height:42px;object-fit:cover;border-radius:6px;cursor:pointer;opacity:.45;border:2px solid transparent;transition:all .15s}
.galeria-thumbs img.active,.galeria-thumbs img:hover{opacity:1;border-color:var(--acc)}
.fi{display:flex;flex-direction:column;gap:.45rem}
.fi-etiqueta{display:inline-block;align-self:flex-start;background:rgba(56,189,248,.12);color:#38bdf8;font-size:.65rem;font-weight:700;padding:.25rem .65rem;border-radius:999px;letter-spacing:1.5px}
.fi-titulo{font-size:1.5rem;font-weight:800;color:#fff;line-height:1.15;margin:0}
.fi-estado{font-size:.8rem;color:var(--mut)}
.fi-precios{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap;margin:.3rem 0}
.precio-ref-f{font-size:1rem;color:#f87171;text-decoration:line-through;font-weight:500}
.precio-final{font-size:2rem;color:#4ade80;font-weight:800}
.ahorro-b{background:rgba(74,222,128,.15);color:#4ade80;font-size:.75rem;padding:.2rem .6rem;border-radius:999px;font-weight:700}
.btn-wa-f{display:flex;align-items:center;justify-content:center;gap:.5rem;background:#25d366;color:#fff;padding:.85rem 1.2rem;border-radius:12px;font-weight:700;font-size:.95rem;text-decoration:none;transition:background .2s}
.btn-wa-f:hover{background:#1ebe5d}
.btn-back-f{display:flex;align-items:center;justify-content:center;gap:.4rem;background:transparent;color:#fff;padding:.7rem 1.2rem;border-radius:12px;font-weight:600;font-size:.85rem;text-decoration:none;border:1px solid var(--line);transition:border-color .2s}
.btn-back-f:hover{border-color:var(--acc)}
.fila-specs{display:grid;grid-template-columns:repeat(5,1fr);gap:.6rem;margin-bottom:1.5rem}
.sp{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.7rem .8rem;display:flex;flex-direction:column;gap:.15rem}
.sp small{font-size:.65rem;color:var(--mut);text-transform:uppercase;letter-spacing:.8px}
.sp b{font-size:.85rem;color:#e2e8f0;font-weight:600}
.fila-texto{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1.5rem}
.txt-box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1rem 1.2rem}
.txt-box h3{font-size:.75rem;font-weight:700;color:var(--acc);letter-spacing:1.5px;text-transform:uppercase;margin:0 0 .5rem}
.txt-box p{font-size:.85rem;color:#94a3b8;line-height:1.65;margin:0}
.fila-extra{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem;margin-bottom:1.5rem}
.extra-box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1rem 1.2rem}
.extra-box h3{font-size:.75rem;font-weight:700;color:var(--acc);letter-spacing:1.5px;text-transform:uppercase;margin:0 0 .6rem}
.puerto-chip{display:inline-block;background:rgba(56,189,248,.08);color:#94a3b8;font-size:.75rem;padding:.25rem .5rem;border-radius:5px;margin:.15rem .15rem 0 0}
.sw-item{margin-bottom:.5rem}
.sw-item b{color:#e2e8f0;font-size:.82rem}
.sw-item small{color:var(--mut);font-size:.7rem;margin-left:.3rem}
.sw-item p{font-size:.78rem;color:#94a3b8;margin:.1rem 0 0;line-height:1.5}
.conf-item{display:flex;align-items:center;gap:.45rem;font-size:.8rem;color:#94a3b8;margin-bottom:.35rem}
.conf-item::before{content:'✓';color:#4ade80;font-weight:700;font-size:.85rem}
@media(max-width:800px){
  .ficha-top{grid-template-columns:1fr}
  .fila-specs{grid-template-columns:repeat(2,1fr)}
  .fila-texto{grid-template-columns:1fr}
  .fila-extra{grid-template-columns:1fr}
  .ficha-wrap{padding-top:80px}
}
</style>
</head>
<body data-page="ficha" style="background:var(--bg,#050b18)">

<header class="hd" id="hd">
  <div class="wrap hd-in">
    <a href="/" class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M2 20h20"/></svg></span><span class="brand-tx">HDD <b>TECNOLOGÍA</b><small>STORE · ÑUÑOA</small></span></a>
    <nav class="nav"><a href="/">Inicio</a><a href="/#servicios">Servicios</a><a href="/usados.html" class="active">Notebooks</a><a href="/#contacto">Contacto</a></nav>
    <div class="hd-act"><a class="wa-mini" href="https://wa.me/56961991725" target="_blank" rel="noopener">WhatsApp</a><button class="burger" id="burger" aria-label="Abrir menú"><i></i><i></i><i></i></button></div>
  </div>
</header>

<main>
<div class="ficha-wrap" id="fichaContent">
  <a href="/usados.html" class="ficha-back">← Volver al catálogo</a>
  <div style="text-align:center;padding:3rem 0;color:var(--mut)">Cargando notebook...</div>
</div>
</main>

<footer class="sec foot" style="padding:1.5rem 0">
  <div class="wrap">
    <p class="copy" style="text-align:center">© 2026 HDD Tecnología Store — Ing. Alejandro Casanova · <a href="/privacidad.html">Privacidad</a> · <a href="/terminos.html">Términos</a></p>
  </div>
</footer>

<a class="wa-float" id="waFloat" target="_blank" rel="noopener" href="https://wa.me/56961991725" aria-label="WhatsApp"><span class="pulse"></span>✆<span class="tip">Escríbeme ahora</span></a>
<button id="top" aria-label="Volver arriba">↑</button>
<div id="toast" role="status" aria-live="polite"></div>

<script src="/app.js?v=heroFix2v2" defer></script>
<script>
(async function(){
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  const slug = params.get('slug');
  if (!id && !slug) { location.href = '/usados.html'; return; }

  const res = await fetch('/src/data/usados.json');
  const items = await res.json();
  const u = items.find(n => n.id === id || n.slug === slug);
  if (!u) { location.href = '/usados.html'; return; }

  document.title = u.titulo + ' | HDD Tecnología Store';
  const e = u.especificaciones || {};
  const ahorro = u.precio_mercado ? Math.round((1 - u.precio_nosotros/u.precio_mercado)*100) : 0;
  const fotos = (u.fotos || []).map(f => f.url).filter(Boolean);
  const mainImg = fotos[0] || '/img/placeholder-notebook.jpg';
  const waMsg = encodeURIComponent(u.whatsapp_msg || `Hola, me interesa el ${u.titulo} publicado en la tienda.`);

  document.getElementById('waFloat').href = 'https://wa.me/56961991725?text=' + waMsg;

  const specsTop = [
    ['Procesador', e.procesador],
    ['RAM', e.ram],
    ['Disco', e.almacenamiento],
    ['Pantalla', e.pantalla],
    ['GPU', e.gpu],
  ].filter(([,v]) => v);

  const specsExtra = [
    ['Ciclos batería', e.bateria_ciclos],
    ['Salud batería', e.bateria_salud],
    ['SO actual', e.so_actual],
    ['Peso', e.peso],
    ['Año', u.año],
    ['Marca', u.marca],
    ['Modelo', u.modelo],
  ].filter(([,v]) => v);

  const puertos = e.puertos || [];
  const soft = u.software_recomendado || [];

  document.getElementById('fichaContent').innerHTML = `
    <a href="/usados.html" class="ficha-back">← Volver al catálogo</a>
    <div class="ficha-top">
      <div>
        <div class="galeria-main"><img id="mainImg" src="${mainImg}" alt="${u.titulo}"></div>
        ${fotos.length > 1 ? `<div class="galeria-thumbs">${fotos.map((f,i) => `<img src="${f}" alt="Foto ${i+1}" class="${i===0?'active':''}" onclick="document.getElementById('mainImg').src='${f}';document.querySelectorAll('.galeria-thumbs img').forEach(t=>t.classList.remove('active'));this.classList.add('active')">`).join('')}</div>` : ''}
      </div>
      <div class="fi">
        <span class="fi-etiqueta">${(u.etiqueta||'').toUpperCase()}</span>
        <h1 class="fi-titulo">${u.titulo}</h1>
        ${u.estado ? `<span class="fi-estado">Estado: <b style="color:#e2e8f0">${u.estado}</b> · Stock disponible</span>` : ''}
        <div class="fi-precios">
          ${u.precio_mercado ? `<span class="precio-ref-f">$${u.precio_mercado.toLocaleString()}</span>` : ''}
          <span class="precio-final">$${u.precio_nosotros.toLocaleString()}</span>
          ${ahorro > 0 ? `<span class="ahorro-b">${ahorro}% OFF</span>` : ''}
        </div>
        <a class="btn-wa-f" href="https://wa.me/56961991725?text=${waMsg}" target="_blank">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
          Consultar por WhatsApp
        </a>
        <a class="btn-back-f" href="/usados.html">← Ver todos los notebooks</a>
      </div>
    </div>

    ${specsTop.length ? `<div class="fila-specs">${specsTop.map(([k,v]) => `<div class="sp"><small>${k}</small><b>${v}</b></div>`).join('')}</div>` : ''}

    <div class="fila-texto">
      ${u.resumen ? `<div class="txt-box"><h3>Descripción</h3><p>${u.resumen}</p></div>` : '<div></div>'}
      ${u.condicion_detalle ? `<div class="txt-box"><h3>Estado y condición</h3><p>${u.condicion_detalle}</p></div>` : '<div></div>'}
    </div>

    <div class="fila-extra">
      ${specsExtra.length ? `<div class="extra-box"><h3>Ficha técnica</h3>${specsExtra.map(([k,v]) => `<div style="display:flex;justify-content:space-between;padding:.25rem 0;border-bottom:1px solid var(--line)"><span style="font-size:.8rem;color:var(--mut)">${k}</span><b style="font-size:.82rem;color:#e2e8f0;font-weight:600">${v}</b></div>`).join('')}</div>` : ''}
      ${puertos.length ? `<div class="extra-box"><h3>Puertos</h3>${puertos.map(p => `<span class="puerto-chip">${p}</span>`).join('')}</div>` : ''}
      ${soft.length ? `<div class="extra-box"><h3>Software recomendado</h3>${soft.map(s => `<div class="sw-item"><b>${s.nombre}</b><small>(${s.categoria})</small><p>${s.por_que}</p></div>`).join('')}</div>` : ''}
    </div>

    <div class="extra-box" style="margin-bottom:2rem">
      <h3>¿Por qué comprar aquí?</h3>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.3rem">
        <div class="conf-item">Garantía real de 30 días</div>
        <div class="conf-item">Diagnóstico completo antes de vender</div>
        <div class="conf-item">Atención directa con el técnico</div>
        <div class="conf-item">20 años de experiencia</div>
        <div class="conf-item">Despacho a todo Chile</div>
        <div class="conf-item">Retiro en Ñuñoa</div>
      </div>
    </div>
  `;
})();
</script>
</body>
</html>
